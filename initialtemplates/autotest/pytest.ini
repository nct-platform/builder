[pytest]
testpaths = tests
addopts = -ra -q --strict-markers --junitxml=test-results/junit.xml
markers =
    smoke: the application is up and the session works
    auth: sign-in, sign-out, session, author mode
    nav: the left navigation and the pages it reaches
    i18n: every locale the project declares, and what must not leak between them
    register: a list page (CRUD table / process table) renders, filters, pages, offers the right row actions
    form: a form opens with all its fields, its pickers populate, its defaults and validations hold
    rule: a predicate, execution or validation rule observed in action
    calc: a number the system computed, checked against the PRD formula with the scenario's own inputs
    ripple: what ELSE changed after an action — the dependent records, totals, states, queues
    workflow: a process path through the BPMN, task by task, as the role that owns each task
    roles: role groups — the test users made for them, and what each one may see and do
    prohibition: the system must REFUSE, and must say why
    report: reports, dashboards and charts — their numbers against their data
    studio: custom HTML Studio components
    print: PDF printouts and mail templates
    api: the public API (needs API_KEY)
    author: author-mode-only surfaces
    destructive: writes to a real tenant — runs only with --run-destructive
    sends: sends a real mail, message or call out of the tenant — runs only with --run-sends
    technical_error_expected(reason): the scenario shows a user a technical error ON PURPOSE (say why); without it any such message fails the test
